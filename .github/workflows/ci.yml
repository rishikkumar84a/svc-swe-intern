name: CI - Tests & Coverage

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Force npm to omit optional dependencies (prevents Rollup trying to load native binaries)
    env:
      NODE_ENV: test
      # Avoid optional native binaries that cause platform-specific failures in CI
      NPM_CONFIG_OPTIONAL: "true"
      # Set DB url for tests (adjust if your tests require different creds)
      DATABASE_URL: postgres://test:test@localhost:5432/app_test
      # Disable npm fund/audit logs noise in CI installs
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d app_test"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify node & npm
        run: |
          node -v
          npm -v

      - name: Install root dependencies (create root lockfile state)
        run: |
          # Use CI-friendly install and explicitly omit optional (prevents native-rollup issues)
          npm ci --no-audit --no-fund --omit=optional

      - name: Install server dependencies
        run: |
          if [ -f server/package-lock.json ]; then
            npm ci --prefix server --no-audit --no-fund --omit=optional
          fi

      - name: Install client dependencies
        run: |
          if [ -f client/package-lock.json ]; then
            npm ci --prefix client --no-audit --no-fund --omit=optional
          fi

      - name: Wait for Postgres
        run: |
          for i in `seq 1 20`; do
            pg_isready -h localhost -p 5432 -U test && break
            echo "waiting for postgres..."
            sleep 1
          done

      - name: Run tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test
        run: npm run test:ci

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            client/coverage
            server/coverage
