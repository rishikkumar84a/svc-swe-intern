name: CI - Tests & Coverage

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d app_test"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root & workspace deps
        run: |
          if [ -f package-lock.json ]; then
            echo "Installing root deps"
            npm ci
          fi

          if [ -f server/package-lock.json ]; then
            npm ci --prefix server
          fi

          if [ -f client/package-lock.json ]; then
            npm ci --prefix client
          fi

      - name: Wait for Postgres
        run: |
          for i in `seq 1 20`; do
            pg_isready -h localhost -p 5432 -U test && break
            echo "waiting for postgres..."
            sleep 1
          done

      - name: Run tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/app_test
          NODE_ENV: test
        run: npm run test:ci

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            client/coverage
            server/coverage
